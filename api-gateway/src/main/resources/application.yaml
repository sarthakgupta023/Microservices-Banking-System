server:
  port: 8090

spring:
  application:
    name: api-gateway

  cloud:
    gateway:
      # CORS Config — Allows your React/Vite frontends to talk to the gateway
      globalcors:
        corsConfigurations:
          '[/**]':
            allowedOrigins:
              - "http://localhost:3000"   # React dev server
              - "http://localhost:5173"   # Vite dev server
            allowedMethods:
              - GET
              - POST
              - PUT
              - DELETE
              - OPTIONS
            allowedHeaders: "*"
            allowCredentials: true

      # ── ROUTES — Docker internal network routing ──────────────
      routes:

        # 1. Auth Service Route (Points to Docker container name)
        - id: auth-service
          uri: http://auth-service:8081
          predicates:
            - Path=/api/auth/**
          filters:
            - name: JwtAuthFilter
              args:
                # 💡 Fixed: Pass as a single comma-separated string for flawless parsing
                excludedPaths: "/api/auth/register,/api/auth/login,/api/auth/validate"
        
        # 2. Account Service Route
        - id: account-service
          uri: http://account-service:8082
          predicates:
            - Path=/api/accounts/**
          filters:
            - StripPrefix=1
            - JwtAuthFilter

        # 3. Transaction Service Route (Points to Docker container name)
        - id: transaction-service
          uri: http://transaction-service:8083
          predicates:
            - Path=/api/transactions/**
          filters:
            - JwtAuthFilter

# JWT Config — Keep this secure and uniform across services
jwt:
  secret: ${JWT_SECRET:BankingAppSuperSecretKey2024ForJWTSigningMustBe256BitsLong!!}

management:
  endpoints:
    web:
      exposure:
        include: health,info