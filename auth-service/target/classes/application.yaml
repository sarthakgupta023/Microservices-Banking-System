server:
  # Port critical fix: Synchronized with Gateway and Docker routing
  port: 8081

spring:
  application:
    name: auth-service

  # PostgreSQL Network Topology Alignment
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://postgres-db:5432/banking_core}
    username: ${SPRING_DATASOURCE_USERNAME:sarthak_admin}
    password: ${SPRING_DATASOURCE_PASSWORD:supersecurepassword}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: ${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true

# JWT Configuration — Matches across the entire cluster
jwt:
  secret: ${JWT_SECRET:BankingAppSuperSecretKey2024ForJWTSigningMustBe256BitsLong!!}
  expiration: ${JWT_EXPIRATION:86400000}

# Actuator — Health checks utilized by infrastructure orchestration
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always