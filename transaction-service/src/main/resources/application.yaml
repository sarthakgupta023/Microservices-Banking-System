server:
  port: 8083

spring:
  application:
    name: transaction-service

  # PostgreSQL Network Topology Alignment
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://postgres-db:5432/banking_core}
    username: ${SPRING_DATASOURCE_USERNAME:sarthak_admin}
    password: ${SPRING_DATASOURCE_PASSWORD:supersecurepassword}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true

  # ── KAFKA PRODUCER CONFIG ────────────────────────────────
  kafka:
    bootstrap-servers: ${SPRING_KAFKA_BOOTSTRAP_SERVERS:kafka:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      acks: all
      retries: 3
      properties:
        spring.json.add.type.headers: false
    consumer:
      group-id: transaction-service-group
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: "*"
        # CRITICAL: Tell consumer which class to map into since type headers are disabled
        spring.json.value.default.type: "com.banking.transaction_service.event.TransactionEvent"

# JWT Configuration — Re-aligned to match the cluster signature perfectly
jwt:
  secret: ${JWT_SECRET:BankingAppSuperSecretKey2024ForJWTSigningMustBe256BitsLong!!}
  expiration: ${JWT_EXPIRATION:86400000}

# Service URLs (Docker internal DNS resolution)
services:
  account-service:
    url: ${ACCOUNT_SERVICE_URL:http://account-service:8082}