server:
  port: 8083

spring:
  application:
    name: transaction-service

  # PostgreSQL Network Topology Alignment
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://postgres-db:5432/banking_core}
    username: ${SPRING_DATASOURCE_USERNAME:sarthak_admin}
    password: ${SPRING_DATASOURCE_PASSWORD:supersecurepassword}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true

  # ── KAFKA PRODUCER CONFIG ────────────────────────────────
  kafka:
    # Critical Fix: points to docker internal network broker address
    bootstrap-servers: ${SPRING_KAFKA_BOOTSTRAP_SERVERS:kafka:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      properties:
        spring.json.add.type.headers: false
      acks: all
      retries: 3

# JWT Configuration — Re-aligned to match the cluster signature perfectly
jwt:
  secret: ${JWT_SECRET:BankingAppSuperSecretKey2024ForJWTSigningMustBe256BitsLong!!}
  expiration: ${JWT_EXPIRATION:86400000}

# Service URLs (Docker internal DNS resolution)
services:
  account-service:
    url: ${ACCOUNT_SERVICE_URL:http://account-service:8082}